name: Sync Docker Hub overview

on:
  push:
    branches: [master, main]
    paths:
      - docs/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: roura/simple-kanban
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: A deliberately boring kanban board — Next.js + SQLite, with a WeKan importer.
          enable-url-completion: true
